
name: SAM.AI Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name sam_ai

      - name: Fix Android compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          f = next((p for p in files if p.exists()), None)

          if f is None:
              raise SystemExit("Android build.gradle not found")

          s = f.read_text()

          patterns = [
              (r'compileSdk\s*=\s*flutter\.compileSdkVersion',
               'compileSdk = 36'),
              (r'compileSdkVersion\s+flutter\.compileSdkVersion',
               'compileSdkVersion 36'),
              (r'compileSdk\s+flutter\.compileSdkVersion',
               'compileSdk 36'),
          ]

          for pattern, replacement in patterns:
              s, n = re.subn(pattern, replacement, s, count=1)
              if n:
                  break
          else:
              raise SystemExit("Could not update compileSdk")

          f.write_text(s)
          print("compileSdk updated to 36")
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAM-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
